[package]
name = "MultiUp-Direct"
version = "4.0.0-alpha.1"
authors = ["Redpoint"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
#debug = true


[dependencies]
async-recursion = { version = "1.1.1" }
crossbeam-channel = { version = "0.5.13" }
eframe = { version = "0.29.1" }
egui_extras = { version = "0.29.1" }
egui_file = "0.19.0"
egui-toast = { version = "0.15.0" }
futures = { version = "0.3.31" }
headless_chrome = { version = "1.0.15" }
rayon = "1.10.0"
reqwest = { version = "0.12.9", features = ["json", "multipart", "stream"] }
regex = { version = "1.11.1" }
scraper = { version = "0.21.0" }
self_update = { version = "0.41.0", features = ["default", "compression-zip-deflate"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = { version = "1.0.132" }
tokio = { version = "1.41.0", features = ["full", "macros"] }
tokio-util = { version = "0.7.12" }
webbrowser = { version = "1.0.2" }


[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "benchmark"
harness = false